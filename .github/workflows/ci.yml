name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Unreal Engine Environment
        run: |
          echo "Assuming UE is installed at C:\\Program Files\\Epic Games\\UE_5.7"
      - name: Compile Editor Target
        shell: pwsh
        run: |
          & "C:\Program Files\Epic Games\UE_5.7\Engine\Build\BatchFiles\Build.bat" Development Win64 -Project="$PWD\Adventure.uproject" -TargetType=Editor -Progress -NoEngineChanges -NoHotReloadFromIDE
      - name: Scan for TODO/FIXME and generated headers
        shell: pwsh
        run: |
          $errors = $false
          Write-Host "Searching for TODO/FIXME comments..."
          $todos = git grep -n "TODO\|FIXME" || $null
          if ($todos) { Write-Host "Found TODO/FIXME:\n$todos"; $errors = $true }
          Write-Host "Searching for committed *.generated.h files..."
          $gen = git ls-files "*.generated.h" || $null
          if ($gen) { Write-Host "Committed generated headers:\n$gen"; $errors = $true }
          if ($errors) { Write-Error "Lint failures detected" }
      - name: Verify project plugins
        run: |
          python scripts/verify_plugins.py
      - name: Generate animation manifest
        shell: pwsh
        run: |
          Write-Host "Running motion matching pipeline..."
          python Automation/motion_matching_pipeline.py
      - name: Upload animation data
        uses: actions/upload-artifact@v3
        with:
          name: anim-manifest
          path: |
            Saved/AnimManifest.csv
            Saved/*_frames.csv
      - name: Compare manifest to baseline
        shell: pwsh
        run: |
          if (Test-Path Automation\AnimManifestBaseline.csv) {
            $diff = Compare-Object (Get-Content Saved\AnimManifest.csv) (Get-Content Automation\AnimManifestBaseline.csv)
            if ($diff) { Write-Error "Animation manifest differs from baseline" }
          } else {
            Write-Host "No baseline file, skipping diff."
          }
