name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r AI/mcp/server/requirements.txt
      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest AI/mcp/tests --maxfail=1 --disable-warnings -q

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set up Azure Developer CLI
        run: |
          curl -sL https://aka.ms/azd/install | bash
          azd version
      - name: Azure CLI extensions
        run: az extension add --name bicep || true
      - name: Configure azd environment
        run: |
          azd env set AZURE_SUBSCRIPTION_ID ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd env set AZURE_LOCATION eastus
          azd env set AZURE_ENV_NAME ci
          if [ -n "${{ secrets.DEPLOYER_PRINCIPAL_ID }}" ]; then
            azd env set DEPLOYER_PRINCIPAL_ID ${{ secrets.DEPLOYER_PRINCIPAL_ID }}
          fi
      - name: Provision resources
        run: azd provision --preview
      - name: Deploy application
        run: azd deploy
