openapi: 3.0.3
info:
  title: Model Control Plane (MCP) API
  version: "1.0.0"
servers:
  - url: https://mcp.example.com/api
paths:
  /models/register:
    post:
      summary: Register a new model artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version, model_url, model_card_url]
              properties:
                name:
                  type: string
                version:
                  type: string
                model_url:
                  type: string
                model_card_url:
                  type: string
                checksum:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Registered
  /models/promote:
    post:
      summary: Promote model to canary or stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version, target]
              properties:
                name:
                  type: string
                version:
                  type: string
                target:
                  type: string
                  enum: [canary, stable]
                canary_percent:
                  type: integer
      responses:
        '200':
          description: Promoted
  /models/rollback:
    post:
      summary: Rollback model to previous stable version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, to_version]
              properties:
                name:
                  type: string
                to_version:
                  type: string
      responses:
        '200':
          description: Rolled back
  /models/metrics:
    post:
      summary: Ingest telemetry metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_name, model_version, metrics]
              properties:
                model_name:
                  type: string
                model_version:
                  type: string
                metrics:
                  type: object
                  description: |
                    Example:
                    {
                      "latency_ms": 12.3,
                      "error_rate": 0.01,
                      "throughput": 120
                    }
      responses:
        '200':
          description: Metrics accepted
components:
  schemas:
    ModelCard:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        owner:
          type: string
        provenance:
          type: object
